<title>Capitales du monde</title>
<style>
/* Drapeaux en couleur sur tous les appareils (police Twemoji Country Flags, CC-BY 4.0) */
@font-face{font-family:"Twemoji Country Flags";src:url(flags.woff2) format("woff2");unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0062-E0063,U+E0065,U+E0067,U+E006C,U+E006E,U+E0073-E0074,U+E0077,U+E007F;font-display:swap}
/* Layout : une colonne de cartes sombres translucides, posée devant une Terre dessinée dans l'espace */
:root{
  --space:#0b1d26; --card:rgba(12,34,45,.84); --card-2:rgba(20,52,68,.9); --line:rgba(140,200,230,.22);
  --blue:#3d9be6; --lime:#a6e22e; --lime-2:#7cc317; --fg:#f2f8fb; --muted:#9fbccb;
  --ok:#a6e22e; --ko:#ff6b5e;
  --ui:"Twemoji Country Flags", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --num:ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--space);color:var(--fg);font-family:var(--ui);font-size:17px}
#planet,#fire{position:fixed;z-index:0;pointer-events:none;left:0;top:0;width:100vw;height:100vh}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px;min-height:100%}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;color:var(--fg);letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--lime)}
.stats{display:flex;gap:12px;font-family:var(--num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--fg)}
 
.board{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.row-label{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.flap{display:flex;justify-content:center;min-height:48px;align-items:center}
.plain{font-weight:800;color:var(--lime);font-size:clamp(24px,7.5vw,36px);text-align:center;line-height:1.15;overflow-wrap:anywhere}
.ask{font-size:18px;font-weight:600;text-align:center;color:var(--fg)}
.timer{height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--lime),var(--blue));transform-origin:left}
 
.gates{display:grid;grid-template-columns:1fr;gap:10px}
.gate{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;text-align:center;background:var(--card);color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:600 20px/1.2 var(--ui);cursor:pointer}
.gate:hover:not(:disabled){border-color:var(--blue)}
.gate:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.gate .tag{flex:none;width:30px;height:30px;display:grid;place-items:center;font:700 14px var(--ui);color:var(--space);background:var(--blue);border-radius:50%}
.gate span:last-child{min-width:0}
.gate.ok{border-color:var(--ok);background:rgba(90,140,20,.55)}
.gate.ok .tag{background:var(--ok)}
.gate.ko{border-color:var(--ko);background:rgba(150,40,35,.55)}
.gate.ko .tag{background:var(--ko)}
.gate:disabled{cursor:default}
.gates.many{grid-template-columns:1fr 1fr;gap:8px}
.gates.many .gate{padding:10px;gap:10px;font-size:17px}
.gates.many .gate .tag{width:26px;height:26px;font-size:13px}
.gates.many .gate .fl{font-size:36px}
.gates.many .gate:last-child:nth-child(odd){grid-column:span 2}
 
.setup{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px}
.label{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;color:var(--fg);border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font:600 15px var(--ui);cursor:pointer}
.chip[aria-pressed="true"]{color:var(--space);background:var(--blue);border-color:var(--blue)}
.chip:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.go{background:var(--lime);color:var(--space);border:0;border-radius:12px;padding:15px;font:800 19px var(--ui);cursor:pointer}
.go:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.go.alt{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
 
.result{text-align:center;display:flex;flex-direction:column;gap:4px}
.result .big{font-family:var(--num);font-size:46px;font-weight:700;color:var(--lime);font-variant-numeric:tabular-nums}
.result small{color:var(--muted);font-size:14px}
.misses{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.misses li{display:flex;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:17px}
.misses li span:last-child{color:var(--lime);font-weight:600;text-align:right}
.gif{border-radius:12px;overflow:hidden}
.gif iframe{display:block;width:100%;border:0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigflag{font-size:84px;line-height:1.05;font-family:"Twemoji Country Flags","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.gate .fl{font-size:42px;line-height:1;font-family:"Twemoji Country Flags","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.toast{text-align:center;font-size:14px;font-weight:600;color:var(--lime);min-height:18px}
#feedback{background:var(--card);border-radius:10px;padding:6px}
/* roue des paramètres + interrupteurs */
.home-top{display:flex;justify-content:space-between;align-items:center}
.gear{width:38px;height:38px;display:grid;place-items:center;padding:0;background:transparent;color:var(--fg);border:1.5px solid var(--line);border-radius:50%;cursor:pointer}
.gear:hover{border-color:var(--blue)}
.gear:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.gear svg{width:20px;height:20px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:transparent;color:var(--fg);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font:600 17px var(--ui);text-align:left;cursor:pointer}
.opt small{display:block;margin-top:2px;font-weight:400;font-size:13px;color:var(--muted)}
.opt i{flex:none;position:relative;width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.18);transition:background .2s}
.opt i::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s}
.opt[aria-checked="true"] i{background:var(--lime)}
.opt[aria-checked="true"] i::after{transform:translateX(20px);background:var(--space)}
.opt:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
#feedback:empty{visibility:hidden}
</style>
 
</head>
<body>
<canvas id="planet" aria-hidden="true"></canvas>
<canvas id="fire" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="brand">Capitales <em>du monde</em></div>
    <div class="stats"><span>Q <b id="qn">–</b></span><span>Série <b id="streak">0</b></span><span>Pts <b id="pts">0</b></span></div>

  <section class="board" aria-live="polite">

    <div class="ask" id="ask">10 questions, 10 secondes chacune</div>
    <div class="timer"><i id="bar"></i></div>
  </section>
 
  <!-- Écran d'accueil -->
  <div id="home" class="setup">
    <div class="home-top"><div class="label">Zone</div>
      <button class="gear" id="gear" aria-label="Paramètres" title="Paramètres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div class="chips" id="zones"></div>
    <div class="label">Mode</div>
    <div class="chips" id="dirs">
      <button class="chip" id="d1" aria-pressed="true" data-d="pc">Pays → capitale</button>
      <button class="chip" id="d2" aria-pressed="false" data-d="cp">Capitale → pays</button>
      <button class="chip" id="d3" aria-pressed="false" data-d="fp">Drapeau → pays</button>
      <button class="chip" id="d4" aria-pressed="false" data-d="pf">Pays → drapeau</button>
      <button class="chip" id="d5" aria-pressed="false" data-d="full">Full (mix)</button>
    </div>
    <div class="label">Questions par série</div>
    <div class="chips" id="lens"></div>
    <div class="label">Réponses proposées</div>
    <div class="chips" id="chs">
      <button class="chip" id="c4" aria-pressed="true" data-c="4">4</button>
      <button class="chip" id="c7" aria-pressed="false" data-c="7">7</button>
    </div>
    <button class="go" id="start">Jouer</button>
    <div class="toast" id="best"></div>
  </div>
 
  <!-- Paramètres -->
  <div id="settings" class="setup" hidden>
    <div class="label">Paramètres</div>
    <button class="opt" id="optFire" role="switch" aria-checked="true"><span>Flammes<small>La Terre brûle quand ta série monte</small></span><i></i></button>
    <button class="opt" id="optHap" role="switch" aria-checked="true"><span>Vibrations<small>Retour haptique sur téléphone</small></span><i></i></button>
    <button class="go" id="setBack">OK</button>
  </div>
 
  <!-- Jeu -->
  <div id="game" class="gates" hidden></div>
  <div class="toast" id="feedback" hidden></div>
 
  <!-- Fin -->
  <div id="end" class="setup" hidden>
    <div class="result"><div class="big" id="final">0</div><small id="finalSub"></small></div>
    <div class="gif" id="gif" hidden></div>
    <div class="label" id="missLbl">À revoir</div>
    <ul class="misses" id="misses"></ul>
    <div class="btns"><button class="go" id="again">Rejouer</button><button class="go alt" id="menu">Changer de zone</button></div>
  </div>
</div>
 
<script>
const D = {

function showGif(pct){
  const box=$("gif"), g=GIFS.find(x=>pct>=x.min&&(x.max===undefined||pct<=x.max));
  box.innerHTML=""; box.hidden=true;
  if(!g) return;

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{for(let j=a.length-1;j>0;j--){const r=Math.random()*(j+1)|0;[a[j],a[r]]=[a[r],a[j]]}return a};
 
// Paramètres (gardés sur l'appareil)
let FIRE=store.get("cap-fire")!=="0", HAPTIC=store.get("cap-haptic")!=="0";
// Retour haptique : Android → navigator.vibrate ; iPhone (iOS 18+) → astuce de l'interrupteur natif de Safari
const iosTap=(()=>{const l=document.createElement("label"),c=document.createElement("input");
  c.type="checkbox";c.setAttribute("switch","");l.setAttribute("aria-hidden","true");l.style.display="none";l.appendChild(c);
  document.body.appendChild(l);return()=>{try{l.click()}catch(e){}}})();
function buzz(kind){
  if(!HAPTIC) return;
  const pat={ok:25,ko:[70,50,70],tap:15}[kind];
  if(navigator.vibrate){try{navigator.vibrate(pat)}catch(e){}}
  else{iosTap(); if(kind==="ko") setTimeout(iosTap,130)}
}
function syncOpts(){$("optFire").setAttribute("aria-checked",FIRE);$("optHap").setAttribute("aria-checked",HAPTIC)}
$("gear").onclick=()=>{$("home").hidden=true;$("settings").hidden=false;flap("Paramètres");$("ask").textContent="Règle le jeu à ton goût";syncOpts()};
$("setBack").onclick=()=>{$("settings").hidden=true;$("home").hidden=false;homeTitle();showBest()};
$("optFire").onclick=()=>{FIRE=!FIRE;store.set("cap-fire",FIRE?"1":"0");Fire.enable(FIRE);syncOpts()};
$("optHap").onclick=()=>{HAPTIC=!HAPTIC;store.set("cap-haptic",HAPTIC?"1":"0");syncOpts();buzz("tap")};
 
// Affichage simple, sans animation
function flap(text){
  const el=$("flap"); el.innerHTML="";
  const t=document.createElement("span"); t.className="plain"; t.textContent=text.toUpperCase();
  el.appendChild(t);
}
 
function chips(){
  const z=$("zones"); z.innerHTML="";
  ZONES.forEach((name,idx)=>{
    const b=document.createElement("button");
    b.className="chip"; b.id="z"+idx; b.textContent=name; b.setAttribute("aria-pressed",name===zone);
    b.onclick=()=>{zone=name;chips();showBest();$("lblRegion").textContent=zone};
    z.appendChild(b);
  });
}
$("dirs").onclick=e=>{const b=e.target.closest(".chip"); if(!b)return; dir=b.dataset.d;
  document.querySelectorAll("#dirs .chip").forEach(c=>c.setAttribute("aria-pressed",c===b)); lensChips(); showBest(); homeTitle()};
function homeTitle(){flap(dir==="full"?"Full":isFlag(dir)?"Drapeaux":"Capitales")}
// Nombre de questions : 10/20/30/Toutes, ou 20/40/Toutes en mode full
function lensChips(){
  const list=dir==="full"?[20,40,0]:[10,20,30,0], el=$("lens");
  if(!list.includes(ROUND)) ROUND=list[0];
  el.innerHTML="";
  list.forEach(n=>{const b=document.createElement("button");b.className="chip";b.id=n?"n"+n:"nall";b.dataset.n=n;
    b.textContent=n||"Toutes";b.setAttribute("aria-pressed",n===ROUND);el.appendChild(b)});
}
$("lens").onclick=e=>{const b=e.target.closest(".chip"); if(!b)return; ROUND=+b.dataset.n;
  document.querySelectorAll("#lens .chip").forEach(c=>c.setAttribute("aria-pressed",c===b)); showBest()};
const poolSize=()=>zone==="Monde"?ALL.length:D[zone].length;
// en mode full, chaque pays peut sortir 2 fois : une question capitale + une question drapeau
const maxLen=()=>poolSize()*(dir==="full"?2:1);
const roundLen=()=>ROUND?Math.min(ROUND,maxLen()):maxLen();
$("chs").onclick=e=>{const b=e.target.closest(".chip"); if(!b)return; CHOICES=+b.dataset.c;
  document.querySelectorAll("#chs .chip").forEach(c=>c.setAttribute("aria-pressed",c===b)); showBest()};
const bestKey=()=>`cap-best-${zone}-${dir}-${ROUND||"all"}`+(CHOICES>4?`-c${CHOICES}`:"");
function intro(){return `${roundLen()} questions, facile`}
function showBest(){const b=store.get(bestKey()); $("ask").textContent=intro();
  $("best").textContent=b?`Record ${zone} (${ROUND||"toutes"}) : ${b} pts`:"Plus vite, plus de points"}
 
function start(){
  const pool=zone==="Monde"?ALL:ALL.filter(x=>x.z===zone);
  if(dir==="full"){
    // moitié capitales (pays→capitale OU capitale→pays), moitié drapeaux (drapeau→pays OU pays→drapeau)
    // une capitale ne tombe qu'une fois, un drapeau aussi ; « Toutes » = toutes les capitales + tous les drapeaux
    const n=roundLen(), nc=Math.ceil(n/2), nf=n-nc, flip=(a,b)=>Math.random()<.5?a:b;
    const items=shuffle([...shuffle([...pool]).slice(0,nc).map(q=>[q,flip("pc","cp")]),
                         ...shuffle([...pool]).slice(0,nf).map(q=>[q,flip("fp","pf")])]);
    // évite le même pays deux questions de suite
    for(let j=1;j<items.length;j++) if(items[j][0]===items[j-1][0])
      for(let t=0;t<items.length;t++){const k=(j+1+t)%items.length;
        if(k!==j&&k!==j-1&&items[k][0]!==items[j-1][0]&&items[(k+1)%items.length]?.[0]!==items[j][0]&&items[(k-1+items.length)%items.length]?.[0]!==items[j][0]){[items[j],items[k]]=[items[k],items[j]];break}}
    qs=items.map(x=>x[0]); qd=items.map(x=>x[1]);
  }else{ qs=shuffle([...pool]).slice(0,roundLen()); qd=qs.map(()=>dir); }
  i=0;pts=0;streak=0;bestStreak=0;good=0;misses=[];
  $("home").hidden=true;$("end").hidden=true;$("game").hidden=false;$("feedback").hidden=false;
  $("pts").textContent=0;$("streak").textContent=0; Fire.set(0);
  $("lblRegion").textContent=zone; next();
}
function next(){
  if(i>=qs.length) return finish();
  locked=false; cur=qd[i];
  const q=qs[i], same=ALL.filter(x=>x!==q&&(x.z===q.z));
  const pick={pc:"k",cp:"c",fp:"c",pf:"f"}[cur];
  const seen=new Set([q[pick]]), wrong=[];
  for(const x of [...shuffle(same),...shuffle(ALL.filter(x=>x.z!==q.z))]){ if(wrong.length>=CHOICES-1)break; if(!seen.has(x[pick])){seen.add(x[pick]);wrong.push(x)} }
  const opts=shuffle([q,...wrong]);
  $("lblTop").textContent={pc:"Pays",cp:"Capitale",fp:"Drapeau",pf:"Pays"}[cur];
  if(cur==="fp") $("flap").innerHTML=`<span class="bigflag" role="img" aria-label="Drapeau à identifier">${q.f}</span>`;
  else flap(cur==="cp"?q.k:q.c);
  $("ask").textContent={pc:"Quelle est sa capitale ?",cp:"Capitale de quel pays ?",fp:"Quel est ce pays ?",pf:"Quel est son drapeau ?"}[cur];
  $("qn").textContent=`${i+1}/${qs.length}`; $("feedback").textContent="";
  const g=$("game"); g.innerHTML=""; g.classList.toggle("many",CHOICES>4);
  opts.forEach((o,idx)=>{
    const b=document.createElement("button");
    b.className="gate"; b.id="g"+idx; b.dataset.ok=o===q?"1":"";
    b.innerHTML=`<span></span>`;
    b.lastChild.textContent=o[pick];
    if(pick==="f") b.lastChild.className="fl";
    b.onclick=()=>answer(b);
    g.appendChild(b);
  });
  t0=performance.now(); cancelAnimationFrame(raf); tick();
}
function tick(){
  const left=Math.max(0,TIME-(performance.now()-t0));
  $("bar").style.transform=`scaleX(${left/TIME})`;
  if(left<=0) return answer(null);
  raf=requestAnimationFrame(tick);
}
function answer(btn){
  if(locked)return; locked=true; cancelAnimationFrame(raf);
  const left=Math.max(0,TIME-(performance.now()-t0)), q=qs[i];
  const gates=[...document.querySelectorAll(".gate")];
  gates.forEach(b=>{b.disabled=true; if(b.dataset.ok)b.classList.add("ok")});
  const right=btn&&btn.dataset.ok;
  if(right){
    streak++;good++;bestStreak=Math.max(bestStreak,streak);
    let gain=Math.round((50+left/TIME*50)*(1+(CHOICES-4)*.15)); if(streak>=3)gain=Math.round(gain*1.25);
    buzz("ok"); pts+=gain; $("feedback").textContent=`+${gain}`+(streak>=3?` · série ×${streak}`:"");
  }else{
    if(btn)btn.classList.add("ko"); buzz("ko");
    streak=0; misses.push(q);
    $("feedback").textContent=btn?reveal(q):`Temps écoulé · ${reveal(q)}`;
  }
  $("pts").textContent=pts;$("streak").textContent=streak; Fire.set(streak);
  i++; setTimeout(next,right?900:1900);
}
function finish(){
  $("game").hidden=true;$("feedback").hidden=true;$("end").hidden=false;
  $("bar").style.transform="scaleX(0)";
  const prev=+store.get(bestKey())||0, rec=pts>prev; if(rec)store.set(bestKey(),pts);
  const r=good/qs.length; showGif(Math.round(r*100));
  flap(rec?"Record":r>=.8?"Bah bravo ecoute je sais pas trop quoi te dire":r>=.5?"Au moins t'as essayé":"Claqué au sol");
  $("ask").textContent=`${good}/${qs.length} bonnes réponses`;
  $("final").textContent=pts;
  $("finalSub").textContent=`Best streak : ${bestStreak} · Record ${zone} : ${Math.max(prev,pts)}`;
  const ul=$("misses"); ul.innerHTML="";
  $("missLbl").textContent=misses.length?"Tu fera gaffe t'a oublié ça":"Nice";
  [...new Set(misses)].forEach(m=>{const li=document.createElement("li");li.innerHTML="<span></span><span></span>";li.firstChild.textContent=`${m.f}  ${m.c}`;li.lastChild.textContent=m.k;ul.appendChild(li)});
}
$("start").onclick=start; $("again").onclick=start;
$("menu").onclick=()=>{$("end").hidden=true;$("home").hidden=false;homeTitle();$("qn").textContent="–";Fire.set(0);showBest()};
 
chips(); lensChips(); showBest();
homeTitle();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
<script>
// Terre dessinée une seule fois dans l'espace (pas d'animation)
let EARTH=null; // géométrie gardée pour le feu : centre, rayon, contours des continents
function drawPlanet(){
  const c=document.getElementById("planet"), dpr=Math.min(2,devicePixelRatio||1);
  const W=innerWidth,H=innerHeight; c.width=W*dpr;c.height=H*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  let s=11; const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  x.fillStyle="#0b1d26"; x.fillRect(0,0,W,H);
  // étoiles
  for(let k=0;k<Math.round(W*H/2500);k++){
    const sx=rnd()*W, sy=rnd()*H, r=rnd()<.9?.7:1.4;
    x.fillStyle=`rgba(255,255,255,${.35+rnd()*.6})`; x.beginPath(); x.arc(sx,sy,r,0,7); x.fill();
  }
  x.strokeStyle="rgba(255,255,255,.85)"; x.lineWidth=1;
  for(let k=0;k<10;k++){const sx=rnd()*W, sy=rnd()*H, l=3+rnd()*3;
    x.beginPath(); x.moveTo(sx-l,sy);x.lineTo(sx+l,sy);x.moveTo(sx,sy-l);x.lineTo(sx,sy+l);x.stroke()}
  // la Terre
  const R=Math.min(W*.44,H*.34), cx=W/2, cy=H*.6;
  const blob=(bx,by,br,sq,jit)=>{const n=14,pts=[];for(let a=0;a<n;a++){const th=a/n*Math.PI*2,r=br*(1-jit/2+rnd()*jit);pts.push([bx+Math.cos(th)*r,by+Math.sin(th)*r*sq])}
    const p=new Path2D();const m=(i)=>{const A=pts[i%n],B=pts[(i+1)%n];return[(A[0]+B[0])/2,(A[1]+B[1])/2]};let s0=m(n-1);p.moveTo(s0[0],s0[1]);
    for(let i=0;i<n;i++){const q=m(i);p.quadraticCurveTo(pts[i][0],pts[i][1],q[0],q[1])}p.closePath();x.fill(p);return p};
  x.save(); x.beginPath(); x.arc(cx,cy,R,0,7); x.clip();
  x.fillStyle="#1d5fae"; x.fillRect(cx-R,cy-R,2*R,2*R);
  // océan en bandes ondulées
  const blues=["#2470bd","#2d82cc","#3a94d8","#2a78c4"];
  for(let k=0;k<14;k++){x.fillStyle=blues[k%4]; blob(cx+(rnd()-.5)*1.8*R,cy+(rnd()-.5)*1.8*R,R*(.25+rnd()*.35),.45+rnd()*.3,.5)}
  // continents : bord vert, intérieur citron
  const lands=[[-.45,-.35,.28],[-.3,.25,.22],[.25,-.4,.24],[.35,.15,.3],[.6,-.1,.16],[-.05,.75,.2],[.1,-.85,.18]], landPaths=[];
  for(const [dx,dy,dr] of lands){
    const bx=cx+dx*R, by=cy+dy*R, br=dr*R, st=s;
    x.fillStyle="#4fb3e6"; blob(bx,by,br*1.12,.85,.45); s=st;
    x.fillStyle="#6cbf14"; landPaths.push(blob(bx,by,br,.85,.45));
    x.fillStyle="#a6e22e"; blob(bx-br*.08,by-br*.06,br*.68,.8,.5);
    x.fillStyle="#d4f56b"; blob(bx-br*.18,by-br*.15,br*.28,.8,.6);
  }
  // ombre douce sur le bord
  const g=x.createRadialGradient(cx-R*.3,cy-R*.3,R*.3,cx,cy,R);
  g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(1,"rgba(5,20,45,.45)");
  x.fillStyle=g; x.fillRect(cx-R,cy-R,2*R,2*R);
  x.restore();
  EARTH={cx,cy,R,lands:landPaths};
}
 
// Feu : plus la série monte, plus la Terre brûle (série 0 = calme, série 10+ = en feu)
// - séries 1 à 3 : des petites flammes apparaissent une par une sur les continents
// - à partir de la série 4 : une grosse flamme derrière la Terre, qui grandit jusqu'à la série 10
const Fire=(()=>{
  const c=document.getElementById("fire"), probe=document.createElement("canvas").getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let x,W,H,heat=0,target=0,burn=0,burnT=0,nOn=0,flare=0,spots=[],raf=0,last=0,time=0;
 
  // série → chaleur (0..1)
  const bigOf=n=>n<4?0:Math.min(1,(n-3)/7);           // grosse flamme : 0 avant la série 4, max à 10
  const burnOf=n=>Math.min(1,Math.max(0,n)/8);           // continents qui roussissent
  const countOf=n=>n<=0?0:n<=4?n:Math.min(spots.length,4+(n-4)*2); // 1,2,3,4 puis +2 par bonne réponse
  const easeBack=t=>{const k=1.9;t=Math.min(1,Math.max(0,t));return 1+(k+1)*Math.pow(t-1,3)+k*Math.pow(t-1,2)};
 
  function resize(){
    const dpr=Math.min(2,devicePixelRatio||1); W=innerWidth;H=innerHeight;
    c.width=W*dpr;c.height=H*dpr; x=c.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0);
    // emplacements des petites flammes : sur les continents, bien espacés
    const old=spots; spots=[]; const E=EARTH;
    if(E) for(let t=0;t<3000&&spots.length<14;t++){
      const a=Math.random()*6.283, r=Math.sqrt(Math.random())*E.R*.86, px=E.cx+Math.cos(a)*r, py=E.cy+Math.sin(a)*r;
      if(E.lands.some(p=>probe.isPointInPath(p,px,py))&&spots.every(s=>Math.hypot(s.x-px,s.y-py)>E.R*.2))
        spots.push({x:px,y:py,k:.75+Math.random()*.45,ph:Math.random()*6.283,a:0});
    }
    // les premières flammes apparaissent en bas de la Terre (la partie que les boutons ne cachent pas)
    spots.sort((a,b)=>b.y-a.y); spots.forEach((s,j)=>{if(old[j]) s.a=old[j].a});
    paint();
  }
 
  let on=true;
  function enable(v){on=v; if(!v) set(0)}
  function set(n){
    if(!on) n=0;
    const nt=bigOf(n);
    if(n>0&&countOf(n)>=nOn) flare=1;   // petit sursaut à chaque bonne réponse
    target=nt; burnT=burnOf(n); nOn=countOf(n);
    if(reduce){heat=target;burn=burnT;spots.forEach((s,j)=>s.a=j<nOn?1:0);paint();return}
    if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}
  }
 
  // contour de la grosse flamme : un cercle autour de la Terre + une grande langue en haut et deux petites sur les côtés
  // forme de flamme (sert pour la grosse ET les petites) : cercle de rayon base + langues de feu, pointe vers le haut
  function flamePath(cx,cy,base,tip,t,N=120){
    const p=new Path2D(), sway=.07*Math.sin(t*1.6);
    const tongues=[[0,1,.55],[-.95,.42,.26],[.8,.3,.24],[1.75,.14,.2],[-1.9,.1,.2]];
    for(let j=0;j<=N;j++){
      const th=j/N*2*Math.PI-Math.PI, a=th-sway;
      let f=0; tongues.forEach(([c0,amp,w],q)=>{const d=Math.abs(a-c0); if(d<w) f+=amp*(1+.12*Math.sin(t*(3+q)+q))*Math.pow(1-d/w,1.6)});
      const r=base*(1+.012*Math.sin(t*5+th*6))+tip*f;
      const px=cx+Math.sin(th)*r, py=cy-Math.cos(th)*r;
      j?p.lineTo(px,py):p.moveTo(px,py);
    }
    p.closePath(); return p;
  }
 
  function paint(){
    if(!x) return;
    x.clearRect(0,0,W,H);
    const E=EARTH; if(!E||heat<.004&&burn<.004&&!spots.some(s=>s.a>.01)) return;
    const h=heat, R=E.R, pulse=1+flare*.08;
    if(h>.004){
      // lueur douce derrière
      const g=x.createRadialGradient(E.cx,E.cy-R*.1*h,R*.9,E.cx,E.cy-R*.1*h,R*(1.3+h*.5));
      g.addColorStop(0,`rgba(255,110,20,${.35*h})`); g.addColorStop(1,"rgba(255,60,0,0)");
      x.fillStyle=g; x.fillRect(0,0,W,H);
      // grosse flamme en 3 couches (rouge → orange → jaune), avec un contour sombre façon cartoon
      const off=R*(.05+.17*h)*pulse, tip=R*(.22+.6*h)*pulse;
      const L=[[1,1,"#e2330d",.0],[.62,.68,"#ff8a1a",.7],[.3,.4,"#ffd23f",1.4]];
      L.forEach(([ko,kt,col,dt],q)=>{
        const p=flamePath(E.cx,E.cy,R+off*ko,tip*kt,time+dt);
        if(q===0){x.lineJoin="round";x.lineWidth=4;x.strokeStyle="#3a0b05";x.stroke(p)}
        x.fillStyle=col; x.fill(p);
      });
      // on « découpe » la Terre pour que la flamme reste derrière
      x.globalCompositeOperation="destination-out"; x.beginPath(); x.arc(E.cx,E.cy,R-.5,0,7); x.fill();
      x.globalCompositeOperation="source-over";
      x.lineWidth=3; x.strokeStyle=`rgba(58,11,5,${Math.min(1,h*3)})`; x.beginPath(); x.arc(E.cx,E.cy,R+1,0,7); x.stroke();
    }
    if(burn>.004){
      // la Terre chauffe : océans plus chauds, continents roussis
      const b=burn;
      x.save(); x.beginPath(); x.arc(E.cx,E.cy,R,0,7); x.clip();
      x.fillStyle=`rgba(255,90,20,${.2*b})`; x.fillRect(E.cx-R,E.cy-R,2*R,2*R);
      x.fillStyle=`rgba(70,25,8,${.55*b})`; for(const p of E.lands) x.fill(p);
      x.lineWidth=2; x.strokeStyle=`rgba(255,140,40,${.8*b})`; for(const p of E.lands) x.stroke(p);
      x.restore();
    }
    // petites flammes sur les continents : même forme et mêmes couleurs que la grosse, en miniature
    const ih=R*(.2+.08*burn);
    for(const s of spots){
      if(s.a<=.01) continue;
      const sc=easeBack(s.a)*s.k*(1+flare*.06), b=ih*.36*sc, tp=ih*.48*sc, t=time*1.3+s.ph;
      [[1,1,"#e2330d"],[.66,.68,"#ff8a1a"],[.36,.4,"#ffd23f"]].forEach(([kb,kt,col])=>{
        x.fillStyle=col; x.fill(flamePath(s.x,s.y-b,b*kb,tp*kt,t,48));
      });
    }
  }
 
  function loop(now){
    const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt;
    heat+=(target-heat)*Math.min(1,dt*(target>heat?2.5:1.6)); if(Math.abs(target-heat)<.003) heat=target;
    flare=Math.max(0,flare-dt*2.5);
    burn+=(burnT-burn)*Math.min(1,dt*2); if(Math.abs(burnT-burn)<.003) burn=burnT;
    const n=nOn; spots.forEach((s,j)=>{ s.a = j<n ? Math.min(1,s.a+dt*3) : Math.max(0,s.a-dt*2.5) });
    paint();
    if(heat>0||target>0||burn>0||burnT>0||spots.some(s=>s.a>0)) raf=requestAnimationFrame(loop);
    else {raf=0; x.clearRect(0,0,W,H)}
  }
  return {set,resize,enable};
})();
 
drawPlanet(); Fire.resize(); Fire.enable(FIRE);
let rz; addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{drawPlanet();Fire.resize()},200)});
</script>
